name: CI

on: [push, pull_request]

jobs:
  security_scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install security tools
        run: pip install pip-audit bandit
      - name: Dependency audit
        # Report-only, known transitive CVEs shouldn't block deploys
        run: pip-audit -r requirements.txt || true
      - name: Static analysis (medium+)
        run: bandit -r api core agents auth.py database.py comments.py -ll -q

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile application modules
        run: python -m compileall -q api core evals llm_service.py WhatWay.py
      - name: Unit and retrieval tests
        run: PYTHONPATH=. pytest tests/ -q --disable-warnings
      - name: Grounded lexical retrieval quality gate
        run: PYTHONPATH=. python evals/run_retrieval_eval.py
