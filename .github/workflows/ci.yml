name: CI

on: [push, pull_request]

jobs:
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install security tools
        run: pip install pip-audit bandit
      - name: Dependency audit
        # Report-only — known transitive CVEs shouldn't block deploys
        run: pip-audit -r requirements.txt || true
      - name: Static analysis (medium+)
        run: bandit -r api core agents auth.py database.py comments.py -ll -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install smoke deps
        # Keep smoke fast/reliable — privacy tests need no Streamlit stack
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Unit smoke
        run: PYTHONPATH=. pytest tests/ -q --disable-warnings
