[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

# Hide multipage nav (Admin / Clinic detail live as _prefixed pages)
[client]
showSidebarNavigation = false

[theme]
# WhatWay "Warm wayfinding" — one hue, five steps. See the design canvas.
primaryColor = "#0E6B54"          # Spruce  — primary action, links
backgroundColor = "#F1F7F3"       # Mist    — page ground, a green-tinted white
secondaryBackgroundColor = "#FFFFFF"
textColor = "#10221B"             # Ink
font = "sans serif"
